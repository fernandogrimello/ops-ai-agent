services:
  postgres:
    image: postgres:16-alpine
    container_name: ops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ops123}
      POSTGRES_DB: ${POSTGRES_DB:-ops_ai_agent}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    container_name: ops-n8n
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-ops_ai_agent}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-ops}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-ops123}
    ports:
      - "5678:5678"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - n8n_data:/home/node/.n8n

  openclaw:
    image: node:24-alpine
    container_name: ops-openclaw
    restart: unless-stopped
    ports:
      - "18789:18789"
    volumes:
      - openclaw_data:/root/.openclaw
    environment:
      OPENCLAW_GATEWAY_PASSWORD: climatech123
    command: sh -c "npm install -g --allow-scripts=openclaw,@google/genai,protobufjs,tree-sitter-bash openclaw@latest && openclaw gateway --allow-unconfigured --password climatech123"

  waha:
    image: devlikeapro/waha
    container_name: ops-waha
    restart: unless-stopped
    ports:
      - "3002:3000"
    volumes:
      - waha_data:/app/.sessions
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_MEDIA_STORAGE: LOCAL
      WHATSAPP_API_KEY: ""
      WAHA_DASHBOARD_ENABLED: true
      WAHA_DASHBOARD_USERNAME: admin
      WAHA_DASHBOARD_PASSWORD: admin123
      WHATSAPP_SWAGGER_USERNAME: admin
      WHATSAPP_SWAGGER_PASSWORD: admin123
      WAHA_API_KEY: ${WAHA_API_KEY:-waha-api-key-123}

volumes:
  postgres_data:
  n8n_data:
  openclaw_data:
  waha_data:
